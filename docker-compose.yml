version: "3.8"

services:
  # =======================
  # POSTGRES DATABASE
  # =======================
  db:
    image: postgres:15-alpine
    container_name: my-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: abdouzaza
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backup.sql:/docker-entrypoint-initdb.d/backup.sql
    ports:
      - "5432:5432"
    networks:
      - dev-net

  # =======================
  # SPRING BOOT APPLICATION
  # =======================
  app:
    image: abdessalamzarrouk/projetstage-app:latest
    container_name: projetstage
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: abdouzaza
    ports:
      - "8080:8080"
    networks:
      - dev-net

  # =======================
  # SONARQUBE
  # =======================
  sonarqube:
    image: sonarqube:latest
    container_name: sonarqube
    depends_on:
      - db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/postgres
      SONAR_JDBC_USERNAME: postgres
      SONAR_JDBC_PASSWORD: abdouzaza
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - dev-net

  # =======================
  # JENKINS
  # =======================
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock  # allows Jenkins to control Docker
    networks:
      - dev-net

  # =======================
  # PROMETHEUS
  # =======================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - dev-net

  # =======================
  # GRAFANA
  # =======================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - dev-net

# =======================
# NETWORKS & VOLUMES
# =======================
volumes:
  db-data:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  grafana_data:

networks:
  dev-net:
    driver: bridge
